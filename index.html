<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Three Kingdoms Soccer - 三國蹴鞠</title>
    <style>
        * { margin: 0; padding: 0; box-sizing: border-box; }

        html, body { width: 100%; height: 100%; overflow: hidden; }

        body {
            background: #2f6f4f;
            background-image:
                repeating-linear-gradient(90deg,
                    rgba(255, 255, 255, 0.03) 0 40px,
                    rgba(0, 0, 0, 0.03) 40px 80px);
            overflow: hidden;
            /*
             * Breathing room for the canvas's box-shadow frame lives here rather
             * than on the container. With box-sizing:border-box the padding is
             * inside body's 100% height, so the container still measures exactly
             * and Phaser's autoCenter stays symmetric on both axes.
             */
            padding: 8px;
        }

        /*
         * Phaser's Scale.FIT measures this element, so it needs a real size.
         * As a zero-height flex item it collapsed and the canvas scaled down to
         * a thumbnail in the corner. Filling the viewport and letting Phaser's
         * autoCenter do the centring keeps it correct at any window size.
         */
        #game-container {
            width: 100%;
            height: 100%;
        }

        /*
         * The frame is a box-shadow ring rather than a border: a border would sit
         * outside the width/height Phaser writes onto the canvas and reintroduce
         * overflow at some window sizes.
         */
        #game-container canvas {
            display: block;
            border-radius: 4px;
            box-shadow:
                0 0 0 4px #2b2b33,
                0 10px 0 rgba(0, 0, 0, 0.30),
                0 0 48px rgba(0, 0, 0, 0.35);
            /* keep the generated pixel art crisp when scaled up */
            image-rendering: pixelated;
            image-rendering: crisp-edges;
        }
    </style>
</head>
<body>
    <div id="game-container"></div>
    <script src="https://cdn.jsdelivr.net/npm/phaser@3.60.0/dist/phaser.min.js"></script>
    <script type="module" src="src/main.js"></script>
</body>
</html>
